services:
  # -------------------------------------------------------------
  # CampusLLM FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: campusllm-backend
    env: python
    region: oregon
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./campus_llm.db
      - key: ADMIN_PASSWORD
        value: adminpassword123
